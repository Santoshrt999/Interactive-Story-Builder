[project]
name = "storyweaver-backend"
version = "0.1.0"
description = "StoryWeaver - agentic AI interactive story builder for kids (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.39.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "redis>=5.2.0",
    "replicate>=1.0.0",
    "elevenlabs>=1.13.0",
    "structlog>=24.4.0",
    "bcrypt>=4.2.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
